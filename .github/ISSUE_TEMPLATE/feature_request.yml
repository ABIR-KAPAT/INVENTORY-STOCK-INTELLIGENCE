name: ✨ Feature Request
description: Suggest an idea or enhancement for StockWise
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please outline the user experience and business problem.
  - type: input
    id: title
    attributes:
      label: Feature Title
      description: Concise title for the enhancement.
      placeholder: e.g. Batch barcode scanning via web camera
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative solutions or workarounds you've thought of.
