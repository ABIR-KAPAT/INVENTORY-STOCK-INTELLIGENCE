name: 🐛 Bug Report
description: Create a report to help us improve StockWise
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please provide as much information as possible.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A clear and concise summary of what the bug is.
      placeholder: e.g. Stock transfer between warehouses allows negative values under specific condition
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Impacted Module
      description: Which part of the application does this issue affect?
      options:
        - Dashboard / Overview
        - Products Management
        - Categories Management
        - Live Inventory Control
        - Stock Movement Ledger
        - Warehouses
        - Suppliers
        - Purchase Orders
        - Sales & Invoices
        - Reports & Analytics
        - Smart Alerts
        - Settings & Storage
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps did you take to encounter the bug?
      placeholder: |
        1. Go to 'Live Inventory Control'
        2. Click on 'Transfer Warehouse'
        3. Enter quantity...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Error Logs
      description: Drag and drop screenshots or paste console logs here.
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Mozilla Firefox
        - Microsoft Edge
        - Apple Safari
        - Other
    validations:
      required: true
